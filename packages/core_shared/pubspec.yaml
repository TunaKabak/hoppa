name: core_shared
description: "Hoppa - Shared core module containing models, services, and common helpers"
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^17.0.1
  uuid: ^4.5.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  json_annotation: ^4.9.0
  audioplayers: ^6.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  permission_handler: ^11.3.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  fl_chart: ^1.1.1
  flutter_flavor: ^3.1.4
  bcrypt: ^1.2.0
  http: ^1.6.0
  firebase_data_connect: ^0.2.3
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.0.1
  supabase_flutter: ^2.6.0

  # Monorepo packages
  core_auth:
    path: ../core_auth
  core_network:
    path: ../core_network

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
