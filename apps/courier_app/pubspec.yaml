name: courier_app
description: "Hoppa - Kurye Teslimat ve Canlı Konum Takip Uygulaması"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_dotenv: ^5.1.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  flutter_swipe_button: ^2.1.3 # Taktil durum geçişleri için (Swipe to Deliver)

  # Ortak Paketler
  core_network:
    path: ../../packages/core_network
  core_auth:
    path: ../../packages/core_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
