name: consumer_app
description: "Hoppa - Consumer Application"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^17.0.1
  uuid: ^4.5.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  json_annotation: ^4.9.0
  audioplayers: ^6.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  permission_handler: ^11.3.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  fl_chart: ^1.1.1
  flutter_flavor: ^3.1.4
  bcrypt: ^1.2.0
  http: ^1.6.0
  firebase_data_connect: ^0.2.3
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.0.1
  supabase_flutter: ^2.6.0
  speech_to_text: ^7.4.0
  video_player: ^2.8.6

  # Monorepo packages
  core_auth:
    path: ../../packages/core_auth
  core_network:
    path: ../../packages/core_network
  core_shared:
    path: ../../packages/core_shared
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/hoppa_logo.png
    - assets/images/hoppa_icon.png
    - assets/images/hoppa_button.png
    - assets/images/market_bg.png
    - assets/images/restaurant_bg.png
    - assets/images/su_bg.png
    - assets/images/kuruyemis_bg.png
    - assets/images/kahve_bg.png
    - assets/images/cicek_bg.png
    - assets/images/manav_bg.png
    - assets/images/kasap_bg.png
    - assets/images/campaign_free_delivery.png
    - assets/images/campaign_welcome_coupon.png
    - assets/images/campaign_everything_at_door.png
    - assets/images/campaign_invite_friend.png
    - assets/videos/hoppa_reklam.mp4
